<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Compare Headers – Message Header Analyzer</title>
<meta name="color-scheme" content="dark" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236d8dff'/%3E%3Cstop offset='1' stop-color='%2338e6c0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='40' height='40' rx='11' fill='url(%23g)'/%3E%3Ctext x='20' y='27' font-family='Arial,Helvetica,sans-serif' font-size='16' font-weight='700' fill='%230b0d12' text-anchor='middle'%3EMH%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">MH</div>
      <div>
        <h1>Compare Headers</h1>
        <p>Paste or upload two messages side by side to see exactly what differs</p>
      </div>
    </div>
    <div class="topbar-right">
      <a class="btn btn-sm" href="/">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Back to analyzer
      </a>
    </div>
  </div>

  <div class="compare-grid">
    <section class="panel compare-col">
      <p class="compare-col-label">Message A</p>
      <div class="tabs" id="tabsA">
        <button class="tab-btn active" data-tab="upload">Upload .eml / .msg</button>
        <button class="tab-btn" data-tab="paste">Paste headers</button>
      </div>

      <div class="tab-panel active compare-tab-panel" data-tab-panel="upload">
        <label class="dropzone" id="dropzoneA" tabindex="0">
          <div class="dropzone-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M12 4l-4 4M12 4l4 4"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
          </div>
          <p class="dropzone-title">Drop an .eml or .msg file here</p>
          <p class="dropzone-sub">or click to browse</p>
          <input type="file" id="fileA" accept=".eml,.msg,.txt,message/rfc822" />
        </label>
        <div class="filename-chip" id="filenameChipA">
          <span id="filenameTextA"></span>
          <button class="btn btn-ghost btn-sm" id="clearFileBtnA" type="button">✕</button>
        </div>
      </div>

      <div class="tab-panel compare-tab-panel" data-tab-panel="paste">
        <textarea id="inputA" class="paste-textarea" placeholder="Paste raw headers (or a full RFC822 message) for message A…"></textarea>
      </div>
    </section>

    <section class="panel compare-col">
      <p class="compare-col-label">Message B</p>
      <div class="tabs" id="tabsB">
        <button class="tab-btn active" data-tab="upload">Upload .eml / .msg</button>
        <button class="tab-btn" data-tab="paste">Paste headers</button>
      </div>

      <div class="tab-panel active compare-tab-panel" data-tab-panel="upload">
        <label class="dropzone" id="dropzoneB" tabindex="0">
          <div class="dropzone-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M12 4l-4 4M12 4l4 4"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
          </div>
          <p class="dropzone-title">Drop an .eml or .msg file here</p>
          <p class="dropzone-sub">or click to browse</p>
          <input type="file" id="fileB" accept=".eml,.msg,.txt,message/rfc822" />
        </label>
        <div class="filename-chip" id="filenameChipB">
          <span id="filenameTextB"></span>
          <button class="btn btn-ghost btn-sm" id="clearFileBtnB" type="button">✕</button>
        </div>
      </div>

      <div class="tab-panel compare-tab-panel" data-tab-panel="paste">
        <textarea id="inputB" class="paste-textarea" placeholder="Paste raw headers (or a full RFC822 message) for message B…"></textarea>
      </div>
    </section>
  </div>

  <div class="panel">
    <div class="btn-row" style="margin-top:0;">
      <button class="btn btn-primary" id="compareBtn">Compare</button>
      <button class="btn btn-ghost" id="clearCompareBtn" type="button">Clear</button>
    </div>
    <div class="status-line hidden" id="statusLine">
      <div class="spinner"></div>
      <span id="statusText">Comparing…</span>
    </div>
    <div class="error-banner hidden" id="errorBanner"></div>
  </div>

  <section id="compareResults" class="hidden">
    <div class="panel">
      <div class="panel-title-row">
        <p class="panel-title"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z"/></svg> Verdict comparison</p>
        <button class="btn btn-sm" id="shareBtn" type="button">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 10.5l6.8-3.9M8.6 13.5l6.8 3.9"/></svg>
          Share
        </button>
      </div>
      <table class="verdict-compare-table" id="verdictCompareTable"></table>
    </div>

    <div class="panel">
      <p class="panel-title"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg> Received chain comparison</p>
      <div class="compare-grid" style="margin-bottom:0;">
        <div>
          <p class="compare-col-label">Message A (<span id="hopCountA">0</span> hops)</p>
          <div class="hop-list" id="hopListA"></div>
        </div>
        <div>
          <p class="compare-col-label">Message B (<span id="hopCountB">0</span> hops)</p>
          <div class="hop-list" id="hopListB"></div>
        </div>
      </div>
    </div>

    <div class="panel">
      <p class="panel-title"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v18M16 3v18M4 8h4M16 8h4M4 16h4M16 16h4"/></svg> Header differences</p>
      <div class="diff-controls">
        <input type="text" class="header-search" id="diffSearch" placeholder="Filter by header name or value…" />
        <label class="switch-toggle">
          <input type="checkbox" id="onlyDiffToggle" checked />
          <span class="switch-track"><span class="switch-thumb"></span></span>
          <span class="switch-label">Show only differences</span>
        </label>
      </div>
      <table class="diff-table" id="diffTable"></table>
    </div>
  </section>

  <footer>
    <div class="footer-bottom">
      <span>© 2020–<span id="currentYear">2026</span> <a href="https://jnlte.de" target="_blank" rel="noopener">Justin Nolte</a></span>
      <span class="footer-sep">·</span>
      <a class="icon-link" href="https://github.com/jnltedev/mha" target="_blank" rel="noopener" aria-label="GitHub">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.09 3.29 9.4 7.86 10.93.57.1.79-.25.79-.55 0-.27-.01-1.16-.02-2.11-3.2.7-3.88-1.36-3.88-1.36-.52-1.33-1.28-1.68-1.28-1.68-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.03 1.75 2.69 1.25 3.35.96.1-.75.4-1.25.73-1.54-2.55-.29-5.23-1.28-5.23-5.68 0-1.25.45-2.28 1.18-3.08-.12-.29-.51-1.45.11-3.03 0 0 .96-.31 3.15 1.18a10.9 10.9 0 0 1 2.87-.39c.97 0 1.95.13 2.87.39 2.19-1.49 3.15-1.18 3.15-1.18.62 1.58.23 2.74.11 3.03.73.8 1.18 1.83 1.18 3.08 0 4.41-2.69 5.38-5.25 5.67.41.36.78 1.06.78 2.15 0 1.55-.01 2.8-.01 3.18 0 .3.21.66.79.55A10.52 10.52 0 0 0 23.5 12c0-6.35-5.15-11.5-11.5-11.5z"/></svg>
      </a>
    </div>
  </footer>

</div>

<script type="module" src="js/compare.js"></script>
</body>
</html>
